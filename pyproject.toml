[build-system]
# 77 is the floor for the PEP 639 SPDX `license` string and `license-files`.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "devgraphics"
version = "0.2.0"
description = "Replace the emoji in your product with a consistent set of custom branded graphics, from the image generator of your choice."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.9"
authors = [{ name = "mobius29er" }]
keywords = [
    "emoji", "graphics", "branding", "illustration", "icons", "icon-set",
    "image-generation", "diffusion", "sdxl", "stable-diffusion", "comfyui",
    "fooocus", "invokeai", "automatic1111", "openai", "gemini", "svg",
    "design-system", "assets", "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Software Development :: Build Tools",
]
# No "Typing :: Typed": only backends/base.py carries annotations, and there is
# no py.typed marker, so claiming it would be a lie a type checker acts on.

# Core is Pillow and a TOML parser, and that is the whole of it. Every hosted
# backend -- OpenAI, Gemini, and anything OpenAI-compatible -- is stdlib urllib
# and base64, so `pip install devgraphics` installs nothing it will not use.
# tomli disappears on 3.11+, where tomllib is stdlib.
dependencies = [
    "pillow>=10",
    "tomli>=1.1.0; python_version < '3.11'",
]

# Extras rather than core, for two concrete reasons.
#
# websocket-client: only Fooocus and ComfyUI open a socket. An OpenAI user has no
# reason to own it, and a missing transport now reports itself as an actionable
# MissingDependency at render time rather than breaking `import devgraphics`.
#
# vtracer: a Rust wheel, only ever reached by --svg. Its wheel coverage is wide
# but there is no macOS build below cp311, so on macOS with Python 3.9 or 3.10 pip
# falls back to compiling it. Making that a hard dependency would fail the whole
# install for someone who only ever wanted PNGs.
[project.optional-dependencies]
local = ["websocket-client>=1.7"]
svg = ["vtracer>=0.6"]
all = ["websocket-client>=1.7", "vtracer>=0.6"]
dev = ["pytest>=8", "websocket-client>=1.7", "vtracer>=0.6"]

[project.urls]
Homepage = "https://github.com/mobius29er/devGraphics"
Source = "https://github.com/mobius29er/devGraphics"
Issues = "https://github.com/mobius29er/devGraphics/issues"
Funding = "https://github.com/sponsors/mobius29er"

[project.scripts]
devgraphics = "devgraphics.cli:main"

# Third-party backends register here; see docs/backends.md. A dotted
# "module:Class" path passed to --backend works without any packaging at all.
[project.entry-points."devgraphics.backends"]

[tool.setuptools.packages.find]
include = ["devgraphics*"]

[tool.setuptools.package-data]
devgraphics = ["workflows/*.json"]
